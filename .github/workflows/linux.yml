name: Linux build

# Builds KimiLM for Linux (KimiLM-linux-x64.tar.gz) and checks that the bundled engine starts.
# On main, a version that has no release yet (v<version> from app/package.json) is published as a GitHub
# release; KimiOS installs it from releases/latest. Windows installers are still built on Windows.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["app/**", "engine/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm run dist:linux

      - name: Check the bundled engine starts
        run: |
          RES="$PWD/app/release/linux-unpacked/resources"
          DATA="$(mktemp -d)"
          cd "$RES/engine"
          DVA_TOKEN=ci PYTHONNOUSERSITE=1 DVA_SECRETS=file \
            "$RES/python/bin/python3" -m dva serve --port 0 --data-dir "$DATA" --resources "$RES" > "$DATA/engine.out" 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if grep -q "DVA_READY" "$DATA/engine.out"; then echo "engine ready after ${i}s"; kill $PID; exit 0; fi
            kill -0 $PID 2>/dev/null || break
            sleep 1
          done
          cat "$DATA/engine.out"; kill $PID 2>/dev/null; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: KimiLM-linux-x64
          path: app/release/KimiLM-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish a release for a new version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./app/package.json').version")"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to publish"
          else
            gh release create "v$VERSION" app/release/KimiLM-linux-x64.tar.gz \
              --target "$GITHUB_SHA" --title "KimiLM $VERSION" \
              --notes "Linux build of KimiLM $VERSION (x64). Unpack and run ./kimilm, or use KimiOS, which installs it."
          fi
