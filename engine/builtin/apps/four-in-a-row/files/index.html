<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four in a Row</title>
<style>
  html, body { margin:0; height:100%; background:#14171c; color:#e9edf2; font:14px/1.4 system-ui, sans-serif; overflow:hidden; touch-action:manipulation; }
  body { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px; box-sizing:border-box; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button, select { background:#2a323d; color:#e9edf2; border:1px solid #39424e; border-radius:9px; padding:7px 12px; font:inherit; cursor:pointer; }
  label { display:flex; align-items:center; gap:6px; color:#b9c6d4; }
  #status { min-height:22px; font-size:16px; font-weight:600; text-align:center; }
  #tally { color:#93a0ae; font-size:13px; }
  canvas { flex:1; min-height:0; max-width:100%; cursor:pointer; }
  .small { font-size:12px; color:#93a0ae; text-align:center; }
</style>
</head>
<body>
<div class="bar">
  <label>Computer <select id="level"><option value="2">easy</option><option value="4" selected>medium</option><option value="6">hard</option></select></label>
  <label title="Your own model chooses the computer's moves (it can be slow; the code steps in when it answers badly)"><input type="checkbox" id="model"> let my model play</label>
  <button id="again">New game</button>
</div>
<div id="status">Your turn: click a column (or press 1–7)</div>
<div id="tally"></div>
<canvas id="c"></canvas>
<div class="small">You are red and go first; the computer is yellow. ← → and Enter work too.</div>
<script>
const COLS = 7, ROWS = 6, YOU = 1, CPU = 2;
const c = document.getElementById("c"), g = c.getContext("2d");
let board, turn, over, hover = 3, falling = null, tally = { you: 0, cpu: 0, draw: 0 }, thinking = false;

function fresh() { board = Array.from({ length: ROWS }, () => Array(COLS).fill(0)); turn = YOU; over = false; falling = null; say("Your turn: click a column (or press 1–7)"); draw(); }
function say(t) { document.getElementById("status").textContent = t; }
function showTally() { document.getElementById("tally").textContent = `You ${tally.you} · Computer ${tally.cpu} · Draws ${tally.draw}`; }
function free(b, col) { for (let r = ROWS - 1; r >= 0; r--) if (!b[r][col]) return r; return -1; }
function moves(b) { return [3, 2, 4, 1, 5, 0, 6].filter((col) => b[0][col] === 0); }
function wins(b, p) {
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    if (b[r][col] !== p) continue;
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      let k = 1; while (k < 4) { const rr = r + dr * k, cc = col + dc * k; if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || b[rr][cc] !== p) break; k++; }
      if (k === 4) return [[r, col], [r + dr, col + dc], [r + 2 * dr, col + 2 * dc], [r + 3 * dr, col + 3 * dc]];
    }
  }
  return null;
}
// How good a position is for the computer: count open lines of 2 and 3, prefer the centre
function score(b) {
  let s = 0;
  for (let r = 0; r < ROWS; r++) s += (b[r][3] === CPU ? 3 : b[r][3] === YOU ? -3 : 0);
  const lines = [];
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const er = r + 3 * dr, ec = col + 3 * dc; if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
    let mine = 0, theirs = 0; for (let k = 0; k < 4; k++) { const v = b[r + dr * k][col + dc * k]; if (v === CPU) mine++; else if (v === YOU) theirs++; }
    if (mine && theirs) continue;
    s += mine === 3 ? 5 : mine === 2 ? 2 : 0; s -= theirs === 3 ? 6 : theirs === 2 ? 2 : 0;
  }
  return s;
}
function minimax(b, depth, a, beta, me) {
  const ms = moves(b);
  if (wins(b, CPU)) return [null, 100000 + depth];
  if (wins(b, YOU)) return [null, -100000 - depth];
  if (!ms.length) return [null, 0];
  if (depth === 0) return [null, score(b)];
  let best = ms[0], bestV = me ? -Infinity : Infinity;
  for (const col of ms) {
    const r = free(b, col); b[r][col] = me ? CPU : YOU;
    const [, v] = minimax(b, depth - 1, a, beta, !me); b[r][col] = 0;
    if (me ? v > bestV : v < bestV) { bestV = v; best = col; }
    if (me) a = Math.max(a, v); else beta = Math.min(beta, v);
    if (a >= beta) break;
  }
  return [best, bestV];
}
async function cpuMove() {
  thinking = true;
  const depth = Number(document.getElementById("level").value);
  let col = null;
  if (document.getElementById("model").checked && window.kimi) {
    say("Your model is choosing its move…");
    const grid = board.map((row) => row.map((v) => (v === YOU ? "R" : v === CPU ? "Y" : ".")).join(" ")).join("\n");
    try {
      const r = await kimi.ai.ask(`We are playing Connect Four on a 7-column, 6-row board. Top row first; R is the opponent, Y is you, . is empty. Discs fall to the lowest empty cell of a column.\n${grid}\n 1 2 3 4 5 6 7\nChoose your column (1-7): win if you can, block a line of three, otherwise build toward four. The column must not be full.`,
        { schema: { type: "object", required: ["column"], properties: { column: { type: "integer", minimum: 1, maximum: 7 } } } });
      const pick = r && r.json ? Number(r.json.column) - 1 : -1;
      if (pick >= 0 && pick < COLS && board[0][pick] === 0) col = pick;
      else say("Your model chose a full or impossible column: the code plays this one.");
    } catch (e) { say("Your model could not answer (" + e.message + "): the code plays."); }
  }
  if (col === null) { await new Promise((r) => setTimeout(r, 250)); col = minimax(board, depth, -Infinity, Infinity, true)[0]; }
  thinking = false;
  drop(col, CPU);
}
function drop(col, who) {
  if (over || falling) return;
  const r = free(board, col); if (r < 0) return;
  falling = { col, row: r, who, y: -1 };
}
function landed() {
  const { col, row, who } = falling; board[row][col] = who; falling = null;
  const line = wins(board, who);
  if (line) { over = line; if (who === YOU) { tally.you++; say("Four in a row — you win!"); } else { tally.cpu++; say("The computer made four. Try again?"); } save(); return; }
  if (!moves(board).length) { over = true; tally.draw++; say("A draw."); save(); return; }
  turn = who === YOU ? CPU : YOU;
  if (turn === CPU) { say("The computer is thinking…"); cpuMove(); } else say("Your turn");
}
function save() { showTally(); if (window.kimi) kimi.storage.set("tally", tally).catch(() => {}); }

function geom() {
  const w = c.clientWidth, h = c.clientHeight; const cell = Math.min(w / COLS, h / (ROWS + 1));
  return { cell, x0: (w - cell * COLS) / 2, y0: (h - cell * (ROWS + 1)) / 2 + cell };
}
function draw() {
  const dpr = devicePixelRatio || 1; c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const { cell, x0, y0 } = geom();
  g.clearRect(0, 0, c.clientWidth, c.clientHeight);
  if (!over && turn === YOU && !falling) { g.fillStyle = "rgba(232,90,90,.55)"; g.beginPath(); g.arc(x0 + hover * cell + cell / 2, y0 - cell / 2, cell * 0.38, 0, 7); g.fill(); }
  g.fillStyle = "#2754b8"; roundRect(x0 - 6, y0 - 6, cell * COLS + 12, cell * ROWS + 12, 14); g.fill();
  const disc = (x, y, v, glow) => { g.fillStyle = v === YOU ? "#e85a5a" : v === CPU ? "#f2c94c" : "#14171c"; g.beginPath(); g.arc(x, y, cell * 0.38, 0, 7); g.fill(); if (glow) { g.strokeStyle = "#fff"; g.lineWidth = 4; g.stroke(); } };
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const lit = Array.isArray(over) && over.some(([a, b]) => a === r && b === col);
    disc(x0 + col * cell + cell / 2, y0 + r * cell + cell / 2, board[r][col], lit);
  }
  if (falling) disc(x0 + falling.col * cell + cell / 2, y0 + falling.y * cell + cell / 2, falling.who);
}
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (falling) { falling.v = (falling.v || 0) + 40 * dt; falling.y += falling.v * dt; if (falling.y >= falling.row) { falling.y = falling.row; landed(); } }
  draw(); requestAnimationFrame(frame);
}
function colAt(e) { const { cell, x0 } = geom(); const r = c.getBoundingClientRect(); return Math.floor((e.clientX - r.left - x0) / cell); }
c.addEventListener("pointermove", (e) => { const col = colAt(e); if (col >= 0 && col < COLS) hover = col; });
c.addEventListener("pointerdown", (e) => { const col = colAt(e); if (col >= 0 && col < COLS && turn === YOU && !over && !thinking) drop(col, YOU); });
addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= "7" && turn === YOU && !over) drop(Number(e.key) - 1, YOU);
  if (e.key === "ArrowLeft") hover = Math.max(0, hover - 1);
  if (e.key === "ArrowRight") hover = Math.min(COLS - 1, hover + 1);
  if (e.key === "Enter" || e.key === " ") { if (over) fresh(); else if (turn === YOU) drop(hover, YOU); }
});
document.getElementById("again").onclick = () => { if (!falling && !thinking) fresh(); };
document.getElementById("model").onchange = (e) => { if (window.kimi) kimi.storage.set("model", e.target.checked).catch(() => {}); };
fresh(); showTally(); requestAnimationFrame(frame);
if (window.kimi) {
  kimi.storage.get("tally").then((t) => { if (t) { tally = t; showTally(); } }).catch(() => {});
  kimi.storage.get("model").then((m) => { document.getElementById("model").checked = !!m; }).catch(() => {});
}
</script>
</body>
</html>
