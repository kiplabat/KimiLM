<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Racer</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0d1117; font-family:system-ui, sans-serif; color:#fff; touch-action:none; user-select:none; }
  #hud { position:fixed; top:10px; left:12px; right:12px; display:flex; justify-content:space-between; pointer-events:none; text-shadow:0 1px 3px #000; }
  #hud .big { font-size:28px; font-weight:700; } #hud div { line-height:1.25; }
  #center { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center; text-shadow:0 2px 6px #000; }
  #center h1 { font-size:56px; margin:0; } #center p { font-size:17px; margin:6px; color:#dde5ee; }
  #touch { position:fixed; bottom:14px; left:0; right:0; display:none; justify-content:space-between; padding:0 14px; }
  #touch div { display:flex; gap:12px; } #touch button { width:72px; height:72px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; font-size:26px; }
  #map { position:fixed; right:12px; bottom:12px; width:150px; height:150px; background:rgba(0,0,0,.35); border-radius:10px; }
</style>
</head>
<body>
<div id="hud"><div><div class="big" id="pos">–</div><div id="lap">Lap –</div></div><div style="text-align:right"><div class="big" id="spd">0</div><div id="time"></div><div id="best"></div></div></div>
<div id="center"><h1 id="cTitle">Orbit Racer</h1><p id="cText">Press Enter or tap to start · arrows or WASD to drive · Space brakes · C changes the camera · P pauses</p></div>
<canvas id="map" width="300" height="300"></canvas>
<div id="touch"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><div><button data-k="brake">■</button><button data-k="gas">▲</button></div></div>
<script type="module">
import * as THREE from "three";

const LAPS = 3, WIDTH = 16;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87b5e0); scene.fog = new THREE.Fog(0x87b5e0, 180, 520);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 1200);
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
scene.add(new THREE.HemisphereLight(0xdfefff, 0x3a5a2a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(120, 200, 80); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 260, bottom: -260, far: 600 }); sun.shadow.mapSize.set(2048, 2048); scene.add(sun);

// ---------------------------------------------------------------- the track: a closed curve and a road along it
const ctrl = [[0, 0], [120, -10], [190, 40], [200, 130], [140, 190], [60, 160], [10, 210], [-90, 200], [-150, 120], [-120, 40], [-170, -40], [-90, -90]]
  .map(([x, z]) => new THREE.Vector3(x, 0, z));
const curve = new THREE.CatmullRomCurve3(ctrl, true, "centripetal");
const N = 800, pts = curve.getSpacedPoints(N), length = curve.getLength();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshLambertMaterial({ color: 0x4f8a3c }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function ribbon(half, y, color, from = -half) {
  const pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const p = pts[i % N], t = curve.getTangentAt((i % N) / N), n = new THREE.Vector3(-t.z, 0, t.x);
    const a = p.clone().addScaledVector(n, from), b = p.clone().addScaledVector(n, half);
    pos.push(a.x, y, a.z, b.x, y, b.z);
    if (i < N) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide })); m.receiveShadow = true; scene.add(m); return m;
}
ribbon(WIDTH / 2 + 1.2, 0.02, 0xd9d9d9); ribbon(WIDTH / 2, 0.04, 0x3b3f46);
for (let i = 0; i < N; i += 8) {                                  // red and white kerbs, the centre line
  const p = pts[i], t = curve.getTangentAt(i / N), n = new THREE.Vector3(-t.z, 0, t.x);
  for (const side of [-1, 1]) {
    const k = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 3.2), new THREE.MeshLambertMaterial({ color: (i / 8) % 2 ? 0xd23b3b : 0xffffff }));
    k.position.copy(p).addScaledVector(n, side * (WIDTH / 2 + 0.6)); k.position.y = 0.08; k.lookAt(k.position.clone().add(t)); scene.add(k);
  }
  if ((i / 8) % 2 === 0) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 3), new THREE.MeshBasicMaterial({ color: 0xf2f2f2 })); d.position.set(p.x, 0.06, p.z); d.lookAt(d.position.clone().add(t)); scene.add(d); }
}
{ // start line and a gantry
  const t = curve.getTangentAt(0), line = new THREE.Mesh(new THREE.BoxGeometry(WIDTH, 0.02, 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  line.position.set(pts[0].x, 0.07, pts[0].z); line.lookAt(line.position.clone().add(t)); scene.add(line);
  const n = new THREE.Vector3(-t.z, 0, t.x);
  for (const s of [-1, 1]) { const post = new THREE.Mesh(new THREE.BoxGeometry(1, 9, 1), new THREE.MeshLambertMaterial({ color: 0x222831 })); post.position.copy(pts[0]).addScaledVector(n, s * (WIDTH / 2 + 2)); post.position.y = 4.5; scene.add(post); }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(WIDTH + 5, 1.6, 1), new THREE.MeshLambertMaterial({ color: 0xe8705a })); beam.position.set(pts[0].x, 9, pts[0].z); beam.lookAt(beam.position.clone().add(t)); scene.add(beam);
}
const rnd = (a, b) => a + Math.random() * (b - a);
for (let i = 0; i < 160; i++) {                                  // trees, away from the road
  const x = rnd(-330, 330), z = rnd(-260, 420), p = new THREE.Vector3(x, 0, z);
  if (pts.some((q) => q.distanceToSquared(p) < (WIDTH + 10) ** 2)) continue;
  const tree = new THREE.Group(), h = rnd(5, 11);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, h * 0.4), new THREE.MeshLambertMaterial({ color: 0x6b4a2b })); trunk.position.y = h * 0.2;
  const top = new THREE.Mesh(new THREE.ConeGeometry(h * 0.35, h * 0.8, 7), new THREE.MeshLambertMaterial({ color: 0x2f6b2f })); top.position.y = h * 0.75; top.castShadow = true;
  tree.add(trunk, top); tree.position.copy(p); scene.add(tree);
}

// ---------------------------------------------------------------- cars
function carMesh(color) {
  const car = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.4), new THREE.MeshStandardMaterial({ color, metalness: 0.3, roughness: 0.4 })); body.position.y = 0.75; body.castShadow = true;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x1a2330, roughness: 0.2 })); cab.position.set(0, 1.4, -0.2); cab.castShadow = true;
  const wing = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.15, 0.6), new THREE.MeshStandardMaterial({ color: 0x111111 })); wing.position.set(0, 1.35, -2.1);
  car.add(body, cab, wing);
  for (const [x, z] of [[-1.15, 1.4], [1.15, 1.4], [-1.15, -1.4], [1.15, -1.4]]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.4, 14), new THREE.MeshLambertMaterial({ color: 0x111111 })); w.rotation.z = Math.PI / 2; w.position.set(x, 0.45, z); car.add(w); }
  scene.add(car); return car;
}
const grid = [[0, 0], [1, 1], [0, 2], [1, 3]];
const cars = [
  { name: "You", color: 0x3fa7b5, player: true },
  { name: "Ruby", color: 0xe8705a, skill: 0.97, lane: 2.5 },
  { name: "Amber", color: 0xf2c94c, skill: 0.93, lane: -2.5 },
  { name: "Violet", color: 0x9b6fd6, skill: 0.89, lane: 0 },
].map((c, i) => {
  const t = curve.getTangentAt(0), n = new THREE.Vector3(-t.z, 0, t.x);
  const [col, row] = grid[i];
  const p = pts[0].clone().addScaledVector(t, -8 - row * 7).addScaledVector(n, col ? 3.5 : -3.5);
  return { ...c, mesh: carMesh(c.color), pos: p, heading: Math.atan2(t.x, t.z), speed: 0, idx: N - 6 - row * 5, lap: -1, done: false, lapStart: 0, laps: [], finish: 0 };
});
const me = cars[0];

const MAX = 52, ACC = 22, BRAKE = 40, DRAG = 0.35, GRIP = 2.1;
function nearest(car) {   // the curve point nearest the car, searched around the last one (cheap and never jumps)
  let best = car.idx, bd = Infinity;
  for (let k = -12; k <= 30; k++) { const i = (car.idx + k + N) % N; const d = pts[i].distanceToSquared(car.pos); if (d < bd) { bd = d; best = i; } }
  return [best, Math.sqrt(bd)];
}
function drive(car, steer, gas, brake, dt) {
  const [i, off] = nearest(car);
  const prev = car.idx; car.idx = i;
  if (prev > N * 0.85 && i < N * 0.15) { car.lap++; if (car.lap > 0) { car.laps.push(clock - car.lapStart); } car.lapStart = clock; if (car.lap >= LAPS) { car.done = true; car.finish = clock; } }
  if (prev < N * 0.15 && i > N * 0.85) car.lap--;
  const grass = off > WIDTH / 2 + 1, top = grass ? MAX * 0.45 : MAX * (car.skill || 1);
  car.speed += (gas * ACC - brake * BRAKE * Math.sign(car.speed)) * dt;
  car.speed -= car.speed * (DRAG + (grass ? 1.6 : 0)) * dt;
  car.speed = Math.max(-10, Math.min(top, car.speed));
  car.heading += steer * GRIP * dt * Math.min(1, Math.abs(car.speed) / 10) * Math.sign(car.speed || 1);
  car.pos.x += Math.sin(car.heading) * car.speed * dt; car.pos.z += Math.cos(car.heading) * car.speed * dt;
}
function aiControl(car, dt) {
  if (car.done) return drive(car, 0, 0, 1, dt);
  const look = Math.round(10 + car.speed * 0.45);
  const ti = (car.idx + look) % N, t = curve.getTangentAt(ti / N), n = new THREE.Vector3(-t.z, 0, t.x);
  const target = pts[ti].clone().addScaledVector(n, car.lane);
  let want = Math.atan2(target.x - car.pos.x, target.z - car.pos.z) - car.heading;
  want = Math.atan2(Math.sin(want), Math.cos(want));
  const ahead = curve.getTangentAt(((car.idx + 40) % N) / N), bend = 1 - Math.max(0, t.dot(ahead));   // how much the road turns
  const safe = MAX * car.skill * (1 - Math.min(0.55, bend * 2.6));
  drive(car, Math.max(-1, Math.min(1, want * 2.5)), car.speed < safe ? 1 : 0, car.speed > safe + 4 ? 0.6 : 0, dt);
}
function collide() {
  for (let a = 0; a < cars.length; a++) for (let b = a + 1; b < cars.length; b++) {
    const A = cars[a], B = cars[b], d = A.pos.distanceTo(B.pos);
    if (d < 3.6 && d > 0.01) { const push = A.pos.clone().sub(B.pos).setY(0).normalize().multiplyScalar((3.6 - d) / 2); A.pos.add(push); B.pos.sub(push); A.speed *= 0.97; B.speed *= 0.97; if (A.player || B.player) beep(120, 0.08); }
  }
}

// ---------------------------------------------------------------- input, sound, state
const keys = {}, touch = {};
addEventListener("keydown", (e) => {
  keys[e.code] = true; if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
  if (e.code === "KeyC") camMode = (camMode + 1) % 2;
  if (e.code === "KeyP" || e.code === "Escape") paused = state === "race" && !paused;
  if (e.code === "Enter" && state !== "count" && state !== "race") start();
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
addEventListener("pointerdown", () => { if (state === "title" || state === "done") start(); });
if (matchMedia("(pointer: coarse)").matches) document.getElementById("touch").style.display = "flex";
document.querySelectorAll("#touch button").forEach((b) => {
  b.addEventListener("pointerdown", (e) => { touch[b.dataset.k] = true; e.stopPropagation(); });
  b.addEventListener("pointerup", () => { touch[b.dataset.k] = false; }); b.addEventListener("pointerleave", () => { touch[b.dataset.k] = false; });
});
let actx = null, engineOsc = null;
function beep(f, len) { try { actx = actx || new AudioContext(); const o = actx.createOscillator(), v = actx.createGain(); o.frequency.value = f; v.gain.value = 0.05; o.connect(v).connect(actx.destination); o.start(); v.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + len); o.stop(actx.currentTime + len); } catch (e) {} }
function engineSound(speed) {
  try { actx = actx || new AudioContext();
    if (!engineOsc) { engineOsc = actx.createOscillator(); engineOsc.type = "sawtooth"; const v = actx.createGain(); v.gain.value = 0.015; engineOsc.connect(v).connect(actx.destination); engineOsc.start(); engineOsc.gain = v; }
    engineOsc.frequency.value = 50 + Math.abs(speed) * 3.2; engineOsc.gain.gain.value = state === "race" && !paused ? 0.015 : 0; } catch (e) {}
}

let state = "title", paused = false, clock = 0, countdown = 0, camMode = 0, best = null;
const $ = (id) => document.getElementById(id);
function center(title, text) { $("cTitle").textContent = title; $("cText").textContent = text; $("center").style.display = title || text ? "flex" : "none"; }
function start() {
  cars.forEach((c, i) => {
    const t = curve.getTangentAt(0), n = new THREE.Vector3(-t.z, 0, t.x), [col, row] = grid[i];
    c.pos = pts[0].clone().addScaledVector(t, -8 - row * 7).addScaledVector(n, col ? 3.5 : -3.5);
    Object.assign(c, { heading: Math.atan2(t.x, t.z), speed: 0, idx: N - 6 - row * 5, lap: -1, done: false, lapStart: 0, laps: [], finish: 0 });
  });
  clock = 0; countdown = 3.5; state = "count"; paused = false;
}
function order() { return [...cars].sort((a, b) => (a.done && b.done ? a.finish - b.finish : b.done - a.done || (b.lap + b.idx / N) - (a.lap + a.idx / N))); }
const fmtT = (s) => s == null ? "–" : `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;

// ---------------------------------------------------------------- the minimap
const map = $("map").getContext("2d");
const xs = pts.map((p) => p.x), zs = pts.map((p) => p.z), mx0 = Math.min(...xs), mz0 = Math.min(...zs), ms = 260 / Math.max(Math.max(...xs) - mx0, Math.max(...zs) - mz0);
function drawMap() {
  map.clearRect(0, 0, 300, 300); map.strokeStyle = "#cfd6de"; map.lineWidth = 7; map.beginPath();
  pts.forEach((p, i) => { const x = 20 + (p.x - mx0) * ms, y = 20 + (p.z - mz0) * ms; i ? map.lineTo(x, y) : map.moveTo(x, y); }); map.closePath(); map.stroke();
  for (const c of cars) { map.fillStyle = "#" + c.color.toString(16).padStart(6, "0"); map.beginPath(); map.arc(20 + (c.pos.x - mx0) * ms, 20 + (c.pos.z - mz0) * ms, c.player ? 9 : 7, 0, 7); map.fill(); }
}

// ---------------------------------------------------------------- the loop
let last = performance.now();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "count") {
    const before = Math.ceil(countdown); countdown -= dt; const after = Math.ceil(countdown);
    if (after !== before && after > 0) beep(440, 0.15);
    center(countdown > 0.5 ? String(Math.ceil(countdown - 0.5)) : "GO!", "");
    if (countdown <= 0) { state = "race"; beep(880, 0.3); center("", ""); cars.forEach((c) => { c.lapStart = 0; }); }
  }
  if (state === "race" && !paused) {
    clock += dt;
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [], gp = pads[0];
    const steer = (keys.ArrowLeft || keys.KeyA || touch.left ? 1 : 0) - (keys.ArrowRight || keys.KeyD || touch.right ? 1 : 0) - (gp ? gp.axes[0] || 0 : 0);
    const gas = (keys.ArrowUp || keys.KeyW || touch.gas || (gp && gp.buttons[7] && gp.buttons[7].value > 0.1)) ? 1 : 0;
    const brake = (keys.ArrowDown || keys.KeyS || keys.Space || touch.brake || (gp && gp.buttons[6] && gp.buttons[6].value > 0.1)) ? 1 : 0;
    if (me.done) drive(me, 0, 0, 1, dt); else drive(me, Math.max(-1, Math.min(1, steer)), gas, brake, dt);
    cars.slice(1).forEach((c) => aiControl(c, dt));
    collide();
    if (me.done && state === "race") {
      state = "done"; const place = order().indexOf(me) + 1, lapBest = Math.min(...me.laps);
      if (best == null || lapBest < best) { best = lapBest; if (window.kimi) kimi.storage.set("bestLap", best).catch(() => {}); }
      center(place === 1 ? "You win!" : `${["", "1st", "2nd", "3rd", "4th"][place]} place`, `Total ${fmtT(me.finish)} · best lap ${fmtT(lapBest)} · Enter or tap to race again`);
    }
  }
  for (const c of cars) { c.mesh.position.copy(c.pos); c.mesh.rotation.y = c.heading; }
  // camera
  const back = new THREE.Vector3(Math.sin(me.heading), 0, Math.cos(me.heading));
  if (camMode === 0) { camPos.copy(me.pos).addScaledVector(back, -11).setY(5.2); camLook.copy(me.pos).addScaledVector(back, 6).setY(1.2); }
  else { camPos.copy(me.pos).setY(70).addScaledVector(back, -20); camLook.copy(me.pos); }
  camera.position.lerp(camPos, state === "title" ? 1 : Math.min(1, dt * 6)); camera.lookAt(camLook);
  sun.position.set(me.pos.x + 120, 200, me.pos.z + 80); sun.target.position.copy(me.pos); sun.target.updateMatrixWorld();
  // HUD
  const place = order().indexOf(me) + 1;
  $("pos").textContent = `${place}/${cars.length}`;
  $("lap").textContent = `Lap ${Math.min(LAPS, Math.max(1, me.lap + 1))}/${LAPS}`;
  $("spd").textContent = `${Math.round(Math.abs(me.speed) * 3.6)} km/h`;
  $("time").textContent = state === "race" ? fmtT(clock - me.lapStart) : "";
  $("best").textContent = best != null ? `best lap ${fmtT(best)}` : "";
  if (paused) center("Paused", "P to go on");
  else if (state === "race" && $("cTitle").textContent === "Paused") center("", "");
  engineSound(me.speed); drawMap();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (window.kimi) {
  kimi.storage.get("bestLap").then((b) => { if (typeof b === "number") best = b; }).catch(() => {});
  kimi.on("visible", (v) => { if (!v && state === "race") paused = true; });
}
</script>
</body>
</html>
