appId: com.kimilm.app
productName: KimiLM
copyright: Copyright © 2026 Kiplabat Tarus
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - build/icon.*
  - package.json
asarUnpack:
  - node_modules/@playwright/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
extraResources:
  - from: dist
    to: ui
  - from: resources/engine
    to: engine
  - from: resources/python
    to: python
  - from: resources/llama
    to: llama
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: KimiLM-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KimiLM
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: build/installer.nsh      # step-by-step messages; offers to remove Datavera Agent (the old name)
mac:
  target: dmg
  category: public.app-category.productivity
  icon: build/icon.png
